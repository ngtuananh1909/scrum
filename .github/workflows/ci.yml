name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Start local Supabase stack
        id: supabase
        working-directory: client
        run: npm run supabase:start
        continue-on-error: true

      - name: Lint
        id: lint
        working-directory: client
        run: npm run lint
        continue-on-error: true

      - name: Build
        id: build
        working-directory: client
        run: node tests/helpers/with-local-supabase-env.mjs -- npm run build
        continue-on-error: true

      - name: Unit tests
        id: unit
        working-directory: client
        run: npm run test:unit
        continue-on-error: true

      - name: Database policy tests
        id: db-policy
        working-directory: client
        run: npm run test:db-policy
        continue-on-error: true

      - name: Integration tests
        id: integration
        working-directory: client
        run: npm run test:integration
        continue-on-error: true

      - name: Install Chromium
        id: browsers
        working-directory: client
        run: npx playwright install --with-deps chromium
        continue-on-error: true

      - name: Five-player browser test
        id: e2e
        working-directory: client
        run: npm run test:e2e
        continue-on-error: true

      - name: Preserve browser report on failure
        if: always() && steps.e2e.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          if-no-files-found: ignore

      - name: Fail if any verification failed
        if: always()
        env:
          SUPABASE_RESULT: ${{ steps.supabase.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          UNIT_RESULT: ${{ steps.unit.outcome }}
          DB_POLICY_RESULT: ${{ steps.db-policy.outcome }}
          INTEGRATION_RESULT: ${{ steps.integration.outcome }}
          BROWSERS_RESULT: ${{ steps.browsers.outcome }}
          E2E_RESULT: ${{ steps.e2e.outcome }}
        run: |
          failed=0
          for result in "$SUPABASE_RESULT" "$LINT_RESULT" "$BUILD_RESULT" "$UNIT_RESULT" "$DB_POLICY_RESULT" "$INTEGRATION_RESULT" "$BROWSERS_RESULT" "$E2E_RESULT"; do
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"
